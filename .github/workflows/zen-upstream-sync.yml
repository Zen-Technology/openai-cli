name: Zen upstream sync

# Keeps this Zen-Technology fork's default branch current with the upstream
# project, using GitHub's "Sync fork" API (merge-upstream). Upstream commits are
# fast-forwarded when the fork has no local commits, or merged otherwise.
#
# Token: upstream regularly changes files under .github/workflows/, and the
# built-in GITHUB_TOKEN is never allowed to write workflow files. Create a
# fine-grained personal access token (resource owner Zen-Technology, this
# repository, permissions "Contents: Read and write" and "Workflows: Read and
# write") and save it as the repository or organization secret
# ZEN_FORK_SYNC_TOKEN. Without it the job still syncs updates that touch no
# workflow files and fails with an explanation otherwise.
#
# This file is Zen-specific and lives under its own name so it never conflicts
# with upstream changes.

on:
  schedule:
    - cron: "23 5 * * *" # daily, 05:23 UTC
  workflow_dispatch:

permissions:
  contents: write # merge-upstream with the built-in token

concurrency:
  group: zen-upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Sync default branch with upstream
    # only meaningful on a fork; never runs in the upstream repository
    if: github.event.repository.fork
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Merge upstream
        env:
          GH_TOKEN: ${{ secrets.ZEN_FORK_SYNC_TOKEN || github.token }}
          HAS_SYNC_TOKEN: ${{ secrets.ZEN_FORK_SYNC_TOKEN != '' }}
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -uo pipefail
          resp="$RUNNER_TEMP/merge-upstream.json"
          payload="$(jq -cn --arg branch "$BRANCH" '{branch: $branch}')"

          code="$(curl -sS -o "$resp" -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/merge-upstream" \
            -d "$payload")"
          message="$(jq -r '.message // empty' "$resp" 2>/dev/null)"
          merge_type="$(jq -r '.merge_type // empty' "$resp" 2>/dev/null)"
          base="$(jq -r '.base_branch // empty' "$resp" 2>/dev/null)"

          {
            echo "### Upstream sync of \`$BRANCH\`"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| HTTP status | $code |"
            echo "| Upstream | ${base:-n/a} |"
            echo "| Result | ${merge_type:-n/a} |"
            echo "| Message | ${message:-n/a} |"
            echo "| Token | $([ "$HAS_SYNC_TOKEN" = true ] && echo ZEN_FORK_SYNC_TOKEN || echo GITHUB_TOKEN) |"
          } >> "$GITHUB_STEP_SUMMARY"

          case "$code" in
            200)
              echo "Synced: ${merge_type} (${message})"
              ;;
            409)
              echo "::error title=Upstream sync conflict::$BRANCH has commits that conflict with upstream. Merge upstream manually: git fetch upstream && git merge upstream/$BRANCH"
              exit 1
              ;;
            *)
              hint=""
              if [ "$HAS_SYNC_TOKEN" != true ]; then
                hint=" Upstream probably changed workflow files, which GITHUB_TOKEN cannot write: add the ZEN_FORK_SYNC_TOKEN secret (see the header of this workflow)."
              fi
              echo "::error title=Upstream sync failed (HTTP $code)::${message:-no message}.${hint}"
              exit 1
              ;;
          esac
